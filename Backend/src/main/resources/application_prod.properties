spring.config.active.on-profile=prod


cors.allowed-origins=${CROSS_ORIGIN_URL}

app.security.jwt-secret=my-secret-key

app.security.jwt-expiration-in-ms=600000

app.security.token-cookie-name=jwt-token

#port configuration
server.port=${PORT_NUMBER}

#default log level
logging.pattern.console=${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}


logging.level.org.springframework.security=${SPRING_SECURITY_LOC_LEVEL:ERROR}


# -------------Database Configuration------------------------

spring.datasource.url=jdbc:oracle:thin:@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


#Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.proc.param_null_passing=false
spring.jpa.properties.hibernate.synonyms=true




#Hibernate DDL Auto(Create, Create Drop, Validate, Update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false