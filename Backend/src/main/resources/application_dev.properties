spring.config.active.on-profile=dev

cors.allowed-origins=${cors.origin:*}

app.security.jwt-secret=my-secret-key

app.security.jwt-expiration-in-ms=600000

app.security.token-cookie-name=jwt-token

#default log level
logging.pattern.console=${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

#security configuration
#spring.security.user.name=${SECURITY_NAME:admin}
#spring.security.user.password=${SECURITY_PASSWORD:admin}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}


#port configuration
server.port=${app.port:8080}


# -------------Database Configuration------------------------

spring.datasource.url=jdbc:oracle:thin:@${DATABASE_HOST:localhost}:${DATABASE_PORT:1521}/${DATABASE_NAME:ORCL}
spring.datasource.username=${DATABASE_USERNAME:locker}
spring.datasource.password=${DATABASE_PASSWORD:locker}


#Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.proc.param_null_passing=true
spring.jpa.properties.hibernate.synonyms=true




#Hibernate DDL Auto(Create, Create Drop, Validate, Update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}